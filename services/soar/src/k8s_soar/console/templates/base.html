<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cases{% endblock %} · k8s-soar</title>
{% block head %}{% endblock %}
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #e3e7ec;
  --accent: #2563eb; --accent-soft: #e8efff;
  --bad: #c62828; --bad-soft: #fdecea; --warn: #b45309; --warn-soft: #fff4e5;
  --good: #1e7d4a; --good-soft: #e7f6ee; --info: #475569; --info-soft: #eef1f5;
  --code: #f1f3f6; --shadow: 0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa5b4; --line: #262c35;
    --accent: #6ea0ff; --accent-soft: #1b2740;
    --bad: #ff6b6b; --bad-soft: #3a1d1f; --warn: #f2a33a; --warn-soft: #3a2a14;
    --good: #4cc38a; --good-soft: #15302a; --info: #a3b1c2; --info-soft: #1f252e;
    --code: #11151a; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
  overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 0; }
header.top { background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .inner { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 700; letter-spacing: .2px; color: var(--text); }
.brand span { color: var(--accent); }
header.top nav { display: flex; gap: 14px; flex: 1; }
.who { color: var(--muted); font-size: 13px; }
main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.3; }
h2 { font-size: 15px; margin: 0 0 12px; }
.muted { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); }
.stack > * + * { margin-top: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.sev-emergency .dot, .sev-alert .dot, .sev-critical .dot { background: var(--bad); }
.sev-error .dot, .sev-warning .dot { background: var(--warn); }
.sev-notice .dot, .sev-informational .dot, .sev-debug .dot { background: var(--info); }
.banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.good { background: var(--good-soft); color: var(--good); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; word-break: break-word; }
button, .btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 14px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: #fff; }
input[type=text], textarea { font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
details > summary { cursor: pointer; color: var(--accent); }
@media (max-width: 640px) { header.top .inner { flex-wrap: wrap; } h1 { font-size: 19px; } }
</style>
</head>
<body>
<header class="top"><div class="inner">
  <a class="brand" href="/">k8s-<span>soar</span></a>
  <nav><a href="/">Cases</a></nav>
  <span class="pill {{ 'warn' if mode == 'dry-run' else ('info' if mode == 'notify' else 'accent') }}" title="Response mode">mode: {{ mode }}</span>
  {% if proxy_user or analyst %}<span class="who">{{ proxy_user or analyst }}</span>{% endif %}
</div></header>
<main>
{% if error %}<div class="banner bad">{{ error }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
