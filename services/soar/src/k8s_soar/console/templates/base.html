<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="soar-ui" content="{{ ui_version }}">
<title>{% block title %}Cases{% endblock %} — k8s-soar</title>
<script>try { var t = localStorage.getItem("soar-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root {
  color-scheme: light;
  --bg: #f5f6f8; --surface: #ffffff; --raised: #f9fafb; --inset: #f2f4f7; --hover: #f2f4f7;
  --line: #e4e7ec; --line-strong: #d0d5dd;
  --text: #344054; --strong: #101828; --muted: #667085; --faint: #98a2b3;
  --accent: #2563eb; --accent-bg: #eff4ff;
  --crit: #d92d20; --crit-bg: #fef3f2; --warn: #b54708; --warn-bg: #fffaeb; --ok: #067647; --ok-bg: #ecfdf3;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c0e12; --surface: #13161b; --raised: #181c22; --inset: #0f1216; --hover: #1b2028;
    --line: #23282f; --line-strong: #2f3640;
    --text: #c9d0d9; --strong: #f2f4f7; --muted: #8d97a5; --faint: #5f6875;
    --accent: #6aa1ff; --accent-bg: rgba(106, 161, 255, .10);
    --crit: #f97066; --crit-bg: rgba(249, 112, 102, .10); --warn: #fdb022; --warn-bg: rgba(253, 176, 34, .10);
    --ok: #47cd89; --ok-bg: rgba(71, 205, 137, .10); --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0e12; --surface: #13161b; --raised: #181c22; --inset: #0f1216; --hover: #1b2028;
  --line: #23282f; --line-strong: #2f3640;
  --text: #c9d0d9; --strong: #f2f4f7; --muted: #8d97a5; --faint: #5f6875;
  --accent: #6aa1ff; --accent-bg: rgba(106, 161, 255, .10);
  --crit: #f97066; --crit-bg: rgba(249, 112, 102, .10); --warn: #fdb022; --warn-bg: rgba(253, 176, 34, .10);
  --ok: #47cd89; --ok-bg: rgba(71, 205, 137, .10); --shadow: none;
}
* { box-sizing: border-box; }
/* Components set display (grid/flex); without this, [hidden] would be ignored. */
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); font-feature-settings: "tnum" 1; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
:not(pre) > code { background: var(--inset); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--strong); overflow-wrap: anywhere; }
h1 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 650; letter-spacing: -.015em; color: var(--strong); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; color: var(--strong); }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.label { font-size: 11.5px; font-weight: 500; color: var(--muted); }

/* menu bar */
.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(140%) blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1200px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; gap: 28px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--strong); font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.brand:hover { text-decoration: none; }
.brand svg { color: var(--accent); }
.nav { display: flex; gap: 4px; }
.nav a { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.nav a:hover { color: var(--strong); background: var(--hover); text-decoration: none; }
.nav a.on { color: var(--strong); background: var(--hover); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--warn); color: #fff;
  font-size: 11.5px; font-weight: 600; display: inline-grid; place-items: center; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--line);
  border-radius: 8px; color: var(--muted); font-size: 12.5px; }
.chip b { color: var(--strong); font-weight: 600; }
.chip.dry-run b { color: var(--warn); }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer; }
.iconbtn:hover { color: var(--strong); background: var(--hover); }
.iconbtn .moon { display: none; }
:root[data-theme="dark"] .iconbtn .sun { display: none; } :root[data-theme="dark"] .iconbtn .moon { display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .iconbtn .sun { display: none; } :root:not([data-theme]) .iconbtn .moon { display: block; } }
.who { color: var(--muted); font-size: 13px; }

main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.card > section { padding: 18px 20px; }
.card > section + section { border-top: 1px solid var(--line); }
.notice { border-radius: 10px; padding: 11px 14px; margin-bottom: 18px; background: var(--ok-bg); color: var(--ok); }
.notice.err { background: var(--crit-bg); color: var(--crit); }

/* severity and status */
.sev { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.sev-critical, .sev-alert, .sev-emergency { color: var(--crit); }
.sev-error, .sev-warning { color: var(--warn); }
.sev-notice, .sev-informational, .sev-debug { color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-weight: 500; color: var(--text); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.status.awaiting { color: var(--warn); } .status.awaiting::before { background: var(--warn); }
.status.in_progress { color: var(--accent); } .status.in_progress::before { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.status.failed { color: var(--crit); } .status.failed::before { background: var(--crit); }
.status.closed::before { background: var(--ok); }
.v-bad { color: var(--crit); } .v-good { color: var(--ok); } .v-warn { color: var(--warn); }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--inset); color: var(--muted); }
.tag.crit { background: var(--crit-bg); color: var(--crit); } .tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent-bg); border-top-color: var(--accent);
  animation: spin .8s linear infinite; flex: none; }

/* code blocks */
.code { border: 1px solid var(--line); border-radius: 10px; background: var(--inset); overflow: hidden; }
.code + .code { margin-top: 12px; }
.code-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 14px;
  border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; color: var(--strong); }
.copy { font: 500 12px var(--sans); color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.copy:hover { color: var(--strong); background: var(--hover); }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 16px; font-size: 12px; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
dl.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 16px; margin: 0; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; min-width: 0; }
details summary { cursor: pointer; color: var(--muted); }
/* collapsible cards */
.fold > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 15px 20px; cursor: pointer; color: var(--strong); font-weight: 600; font-size: 13px; user-select: none; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary > span:first-child { display: inline-flex; align-items: center; gap: 8px; }
.fold > summary > span:first-child::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--faint);
  border-bottom: 2px solid var(--faint); transform: rotate(-45deg); transition: transform .15s; margin-right: 2px; }
.fold[open] > summary > span:first-child::before { transform: rotate(45deg); }
.fold > summary > span + span { font-weight: 400; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fold[open] > summary { border-bottom: 1px solid var(--line); }
.fold > summary:hover { background: var(--hover); border-radius: 12px; }
.fold[open] > summary:hover { border-radius: 12px 12px 0 0; }
.panels, .stack { display: grid; gap: 18px; }
details summary:hover { color: var(--strong); }

button.primary { font: 600 14px var(--sans); padding: 10px 18px; border-radius: 9px; cursor: pointer; border: 0;
  background: var(--strong); color: var(--surface); }
button.primary.danger { background: var(--crit); color: #fff; }
button.primary:disabled { opacity: .6; cursor: progress; }
input[type=text], textarea { width: 100%; font: 14px var(--sans); color: var(--strong); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 12px; }
input[type=text]:focus, textarea:focus { outline: 3px solid var(--accent-bg); border-color: var(--accent); }
main.loading { opacity: .55; transition: opacity .15s .1s; }

/* modal */
dialog.modal { width: min(440px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); color: var(--text); box-shadow: 0 24px 48px -12px rgba(16, 24, 40, .25); }
dialog.modal::backdrop { background: rgba(10, 13, 18, .45); backdrop-filter: blur(2px); }
dialog.modal[open] { animation: pop .14s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
.modal-body { padding: 22px 22px 18px; }
.modal-body h3 { margin: 0 0 6px; font-size: 16px; color: var(--strong); }
.modal-body p { margin: 0; color: var(--muted); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--line); background: var(--raised);
  border-radius: 0 0 14px 14px; }
button.ghost { font: 500 14px var(--sans); padding: 10px 16px; border-radius: 9px; cursor: pointer; background: transparent;
  color: var(--text); border: 1px solid var(--line-strong); }
button.ghost:hover { background: var(--hover); }
@media (max-width: 760px) {
  .bar-in { gap: 14px; padding: 0 16px; } .chip, .who { display: none; } main { padding: 20px 16px 60px; }
  dl.kv { grid-template-columns: 1fr; gap: 2px; } dl.kv dd { margin-bottom: 10px; }
}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="/">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
    k8s-soar
  </a>
  <nav class="nav">
    <a href="/" class="on">Cases <span class="count" id="awaiting-count" {% if not awaiting_count %}hidden{% endif %} title="Awaiting a decision">{{ awaiting_count }}</span></a>
  </nav>
  <div class="bar-right">
    <span class="chip {{ mode }}" title="Response mode: what k8s-soar may do on its own">Mode <b>{{ mode }}</b></span>
    {% if proxy_user or analyst %}<span class="who">{{ proxy_user or analyst }}</span>{% endif %}
    <button class="iconbtn" id="theme" type="button" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div></header>
<dialog class="modal" id="modal" aria-labelledby="modal-title">
  <form method="dialog">
    <div class="modal-body"><h3 id="modal-title"></h3><p id="modal-text"></p></div>
    <div class="modal-actions">
      <button class="ghost" value="cancel" type="submit">Cancel</button>
      <button class="primary" value="ok" type="submit" id="modal-ok">Confirm</button>
    </div>
  </form>
</dialog>
<main data-poll="{% block poll %}0{% endblock %}">
{% if error %}<div class="notice err">{{ error }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
<script>
/* A small client: in-place navigation, live updates of [data-live] regions, form posts
   without reloads, tabs, copy buttons, ticking timers and the theme switch. */
(function () {
  var main = function () { return document.querySelector("main"); };

  // Custom confirmation dialog (never the browser's confirm()).
  function ask(opts) {
    var dlg = document.getElementById("modal"), ok = document.getElementById("modal-ok");
    document.getElementById("modal-title").textContent = opts.title;
    document.getElementById("modal-text").textContent = opts.text || "";
    ok.textContent = opts.confirm || "Confirm";
    ok.classList.toggle("danger", !!opts.danger);
    return new Promise(function (resolve) {
      dlg.addEventListener("close", function done() {
        dlg.removeEventListener("close", done);
        resolve(dlg.returnValue === "ok");
      });
      dlg.returnValue = "";
      dlg.showModal();
      ok.focus();
    });
  }

  function dark() {
    var t = document.documentElement.dataset.theme;
    return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.getElementById("theme").addEventListener("click", function () {
    var next = dark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("soar-theme", next); } catch (e) {}
  });

  // A newer console was deployed: load it fully instead of mixing old CSS/JS with new markup.
  var uiVersion = (document.querySelector("meta[name=soar-ui]") || {}).content;
  function stale(doc) {
    var v = (doc.querySelector("meta[name=soar-ui]") || {}).content;
    return v && uiVersion && v !== uiVersion;
  }

  function adopt(doc) {
    document.title = doc.title;
    var badge = doc.getElementById("awaiting-count"), mine = document.getElementById("awaiting-count");
    if (badge && mine) { mine.textContent = badge.textContent; mine.hidden = badge.hidden; }
  }

  function replaceMain(html, url) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    if (stale(doc)) { location.href = url || location.href; return; }
    adopt(doc);
    main().replaceWith(doc.querySelector("main"));
    setup();
  }

  async function go(url, push) {
    main().classList.add("loading");
    try {
      var r = await fetch(url, { headers: { "X-Soar-Client": "1" } });
      replaceMain(await r.text(), r.url);
      if (push) history.pushState(null, "", r.url);
      window.scrollTo(0, 0);
    } catch (e) { location.href = url; }
  }

  // Live updates: swap only the regions that changed; never one the user is typing in.
  async function refresh() {
    var r = await fetch(location.href, { headers: { "X-Soar-Client": "1" } });
    if (!r.ok) return;
    var doc = new DOMParser().parseFromString(await r.text(), "text/html");
    if (stale(doc)) { location.reload(); return; }
    adopt(doc);
    doc.querySelectorAll("[data-live]").forEach(function (next) {
      var cur = document.getElementById(next.id);
      if (!cur) return;
      var busy = cur.contains(document.activeElement) || cur.dataset.dirty;
      if (busy && cur.dataset.state === next.dataset.state) return;
      if (cur.innerHTML.trim() === next.innerHTML.trim() && cur.dataset.state === next.dataset.state) return;
      // Keep what the user expanded or collapsed.
      if (cur.tagName === "DETAILS") next.open = cur.open;
      var inner = cur.querySelectorAll("details"), nextInner = next.querySelectorAll("details");
      inner.forEach(function (d, i) { if (nextInner[i]) nextInner[i].open = d.open; });
      cur.replaceWith(next);
    });
    var newPoll = doc.querySelector("main").dataset.poll;
    main().dataset.poll = newPoll;
    tick();
  }
  (function poll() {
    var every = +(main().dataset.poll || 0);
    setTimeout(async function () {
      if (every && !document.hidden) { try { await refresh(); } catch (e) {} }
      poll();
    }, every || 5000);
  })();

  function tick() {
    document.querySelectorAll("[data-since]").forEach(function (el) {
      var since = Date.parse(el.dataset.since);
      if (isNaN(since)) return;
      var s = Math.max(0, Math.round((Date.now() - since) / 1000));
      el.textContent = s < 60 ? s + "s" : Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
    });
  }
  setInterval(tick, 1000);

  function showTab(name) {
    document.querySelectorAll("[data-tab]").forEach(function (b) { b.classList.toggle("on", b.dataset.tab === name); });
    document.querySelectorAll("[data-panel]").forEach(function (p) {
      var off = p.dataset.panel !== name;
      p.hidden = off;
      p.style.display = off ? "none" : "";
    });
  }

  // Collapsed cards stay collapsed (per card type, per browser).
  function applyFolds() {
    document.querySelectorAll("details[data-fold]").forEach(function (d) {
      try { var v = localStorage.getItem("soar-fold-" + d.dataset.fold); if (v) d.open = v === "open"; } catch (e) {}
    });
  }
  document.addEventListener("toggle", function (ev) {
    var d = ev.target;
    if (d.dataset && d.dataset.fold) { try { localStorage.setItem("soar-fold-" + d.dataset.fold, d.open ? "open" : "closed"); } catch (e) {} }
  }, true);
  function setup() {
    var first = document.querySelector("[data-tab]");
    if (first) showTab((location.hash.slice(1) && document.querySelector('[data-tab="' + location.hash.slice(1) + '"]')) ? location.hash.slice(1) : first.dataset.tab);
    document.querySelectorAll("form[data-decide]").forEach(syncDecision);
    applyFolds();
    tick();
  }
  function syncDecision(form) {
    var c = form.querySelector("input[name=action]:checked"), btn = form.querySelector("button");
    if (!btn) return;
    btn.textContent = c ? c.dataset.label : "Confirm";
    btn.classList.toggle("danger", !!(c && c.dataset.danger));
  }

  document.addEventListener("click", function (ev) {
    var copy = ev.target.closest("[data-copy]");
    if (copy) {
      var text = document.getElementById(copy.dataset.copy).innerText;
      var done = function () { var t = copy.textContent; copy.textContent = "Copied"; setTimeout(function () { copy.textContent = t; }, 1200); };
      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done); }
      else { var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } finally { ta.remove(); } }
      return;
    }
    var tab = ev.target.closest("[data-tab]");
    if (tab) { showTab(tab.dataset.tab); history.replaceState(null, "", "#" + tab.dataset.tab); return; }
    var a = ev.target.closest("a[href]");
    if (a && a.origin === location.origin && !a.target && !ev.metaKey && !ev.ctrlKey && !ev.shiftKey
        && a.getAttribute("href").charAt(0) === "/") {
      ev.preventDefault();
      go(a.href, true);
    }
  });
  addEventListener("popstate", function () { go(location.href, false); });

  document.addEventListener("input", function (ev) {
    var region = ev.target.closest("[data-live]");
    if (region) region.dataset.dirty = "1";
    var form = ev.target.closest("form[data-decide]");
    if (form) syncDecision(form);
  });
  document.addEventListener("change", function (ev) {
    var form = ev.target.closest("form[data-decide]");
    if (form) syncDecision(form);
  });
  document.addEventListener("submit", async function (ev) {
    var form = ev.target.closest("form[data-decide]");
    if (!form) return;
    ev.preventDefault();
    var c = form.querySelector("input[name=action]:checked");
    if (c && c.dataset.danger && !(await ask({
      title: c.dataset.label + "?",
      text: "This runs on " + form.dataset.workload + " and can't be undone from the console.",
      confirm: c.dataset.label, danger: true
    }))) return;
    var btn = form.querySelector("button"), err = form.querySelector(".form-error");
    btn.disabled = true; err.textContent = "";
    try {
      // getAttribute: the radios are named "action", so form.action would return them, not the URL.
      var r = await fetch(form.getAttribute("action"), { method: "POST", body: new URLSearchParams(new FormData(form)),
        headers: { "X-Soar-Client": "1" } });
      if (!r.ok) {
        var body = await r.json().catch(function () { return {}; });
        err.textContent = body.detail || ("Failed (" + r.status + ")");
        btn.disabled = false;
        return;
      }
      replaceMain(await r.text(), r.url);
      history.replaceState(null, "", r.url);
    } catch (e) { err.textContent = "Network error: " + e; btn.disabled = false; }
  });

  setup();
})();
</script>
</body>
</html>
