[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "k8s-soar"
version = "0.2.0"
description = "k8s-soar response actions (Argo Workflow steps) and AI triage agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "kubernetes>=31,<38",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
agent = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "litellm>=1.60,<2",
]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
soar-actions = "k8s_soar.actions.cli:main"
soar-agent = "k8s_soar.agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_soar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
