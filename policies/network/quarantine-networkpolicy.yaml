# Fallback quarantine policy for clusters without CiliumNetworkPolicy CRD
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-soar-quarantine
  namespace: security-lab
  labels:
    app.kubernetes.io/part-of: k8s-soar
spec:
  podSelector:
    matchLabels:
      security.quarantine: "true"
  policyTypes:
    - Ingress
    - Egress
