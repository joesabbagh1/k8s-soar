apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: k8s-soar-block-sensitive-writes
  annotations:
    k8s-soar.io/scenario: "08-sensitive-host-write"
spec:
  podSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - security-lab
  kprobes:
    - call: "security_file_open"
      syscall: false
      args:
        - index: 0
          type: "file"
      selectors:
        - matchArgs:
            - index: 0
              type: "string"
              operator: "Prefix"
              values:
                - "/etc/shadow"
                - "/etc/sudoers"
                - "/root/"
          matchActions:
            - action: Sigkill
