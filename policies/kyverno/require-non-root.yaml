apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: k8s-soar-require-non-root
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    k8s-soar.io/scenario: "06-missing-security-context"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must run as non-root (runAsNonRoot: true)."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  runAsNonRoot: true
