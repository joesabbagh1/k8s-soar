apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    app.kubernetes.io/managed-by: "k8s-soar"
    # Falco needs privileged PSA — it runs an eBPF DaemonSet that hooks into the kernel
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: tetragon
  labels:
    app.kubernetes.io/managed-by: "k8s-soar"
    # Tetragon also needs privileged PSA for its eBPF programs
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    app.kubernetes.io/managed-by: "k8s-soar"
