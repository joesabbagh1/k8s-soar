{{- if .Values.soar.responder.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-soar-responder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
    app.kubernetes.io/component: soar-responder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-soar.fullname" . }}-responder
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-soar.fullname" . }}-responder
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-soar.fullname" . }}-responder
subjects:
  - kind: ServiceAccount
    name: k8s-soar-responder
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-soar-responder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
    app.kubernetes.io/component: soar-responder
data:
  responder.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    from kubernetes import client, config

    LABEL_KEY = os.environ.get("QUARANTINE_LABEL_KEY", "security.quarantine")
    LABEL_VALUE = os.environ.get("QUARANTINE_LABEL_VALUE", "true")
    PORT = int(os.environ.get("PORT", "8080"))

    config.load_incluster_config()
    v1 = client.CoreV1Api()


    def quarantine_pod(namespace, pod_name):
        body = {"metadata": {"labels": {LABEL_KEY: LABEL_VALUE}}}
        v1.patch_namespaced_pod(name=pod_name, namespace=namespace, body=body)
        return {"quarantined": True, "namespace": namespace, "pod": pod_name}


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            self.send_response(404)
            self.end_headers()

        def do_POST(self):
            if self.path != "/webhook":
                self.send_response(404)
                self.end_headers()
                return
            length = int(self.headers.get("Content-Length", 0))
            raw = self.rfile.read(length) if length else b"{}"
            try:
                payload = json.loads(raw.decode("utf-8"))
            except json.JSONDecodeError:
                self.send_response(400)
                self.end_headers()
                return

            namespace = payload.get("k8s.ns.name") or payload.get("outputFields", {}).get("k8s.ns.name")
            pod_name = payload.get("k8s.pod.name") or payload.get("outputFields", {}).get("k8s.pod.name")

            if not namespace or not pod_name:
                self.send_response(422)
                self.end_headers()
                self.wfile.write(b"missing pod identity")
                return

            try:
                result = quarantine_pod(namespace, pod_name)
                body = json.dumps(result).encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(body)
            except Exception as exc:
                msg = json.dumps({"error": str(exc)}).encode("utf-8")
                self.send_response(500)
                self.end_headers()
                self.wfile.write(msg)

        def log_message(self, format, *args):
            return


    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-soar-responder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
    app.kubernetes.io/component: soar-responder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: soar-responder
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: soar-responder
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: k8s-soar
    spec:
      serviceAccountName: k8s-soar-responder
      containers:
        - name: responder
          image: {{ .Values.soar.responder.image }}
          command:
            - sh
            - -c
            - pip install --no-cache-dir kubernetes && python /app/responder.py
          ports:
            - name: http
              containerPort: {{ .Values.soar.responder.port }}
          env:
            - name: QUARANTINE_LABEL_KEY
              value: {{ .Values.soar.quarantine.labelKey | quote }}
            - name: QUARANTINE_LABEL_VALUE
              value: {{ .Values.soar.quarantine.labelValue | quote }}
            - name: PORT
              value: {{ .Values.soar.responder.port | quote }}
          volumeMounts:
            - name: app
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: app
          configMap:
            name: k8s-soar-responder
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-soar-responder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
    app.kubernetes.io/component: soar-responder
spec:
  selector:
    app.kubernetes.io/component: soar-responder
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.soar.responder.port }}
      targetPort: http
{{- end }}
