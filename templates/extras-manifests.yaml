{{/*
  Lab and policies-as-code manifests bundled with the Helm release.
  Source of truth remains policies/ and lab/ in the repo (.Files.Glob).
  Render lab/namespace.yaml explicitly first (glob lab/** only matches subdirs).
*/}}
{{- if .Values.lab.enabled }}
---
{{ $.Files.Get "lab/namespace.yaml" }}
{{- range $path, $_ := .Files.Glob "lab/**/*.yaml" }}
{{- if not (hasSuffix "kustomization.yaml" $path) }}
---
{{ $.Files.Get $path }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.policies.enabled }}
{{- range $path, $_ := .Files.Glob "policies/kyverno/*.yaml" }}
{{- if not (hasSuffix "kustomization.yaml" $path) }}
---
{{ $.Files.Get $path }}
{{- end }}
{{- end }}
{{- range $path, $_ := .Files.Glob "policies/tetragon/*.yaml" }}
{{- if not (hasSuffix "kustomization.yaml" $path) }}
---
{{ $.Files.Get $path }}
{{- end }}
{{- end }}
{{- range $path, $_ := .Files.Glob "policies/cilium/*.yaml" }}
---
{{ $.Files.Get $path }}
{{- end }}
{{- range $path, $_ := .Files.Glob "policies/network/*.yaml" }}
---
{{ $.Files.Get $path }}
{{- end }}
{{- end }}
