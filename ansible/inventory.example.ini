# Copy to inventory.ini and customize for your client.
#
# Single-node cluster: leave [workers] empty and set allow_control_plane_scheduling: true
# in group_vars/all.yml.

[master]
node1 ansible_host=192.168.1.10 ansible_user=ubuntu

[workers]
# node2 ansible_host=192.168.1.11 ansible_user=ubuntu
# node3 ansible_host=192.168.1.12 ansible_user=ubuntu

[k8s:children]
master
workers

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_ed25519
# ansible_become_password can be set via ansible-vault in secrets.yml

[localhost_group]
localhost ansible_connection=local
