---
- name: Preflight — verify nodes meet k8s-soar requirements
  hosts: k8s
  become: true
  gather_facts: true
  tasks:
    - name: Assert kernel version meets minimum for eBPF stack
      ansible.builtin.assert:
        that:
          - ansible_kernel is version(min_kernel_version, '>=')
        fail_msg: "Kernel {{ ansible_kernel }} < {{ min_kernel_version }} — Falco/Tetragon require a newer kernel"
        success_msg: "Kernel {{ ansible_kernel }} OK on {{ inventory_hostname }}"

    - name: Check /sys/fs/bpf is mounted (eBPF)
      ansible.builtin.stat:
        path: /sys/fs/bpf
      register: bpf_mount
      failed_when: not bpf_mount.stat.exists

- name: Prepare nodes — OS and Kubernetes packages
  hosts: k8s
  become: true
  tasks:
    - name: Purge K3s and Kubernetes remnants
      ansible.builtin.shell: |
        if [ -f /usr/local/bin/k3s-uninstall.sh ]; then /usr/local/bin/k3s-uninstall.sh; fi
        if [ -f /usr/local/bin/k3s-agent-uninstall.sh ]; then /usr/local/bin/k3s-agent-uninstall.sh; fi
        kubeadm reset -f || true
        rm -rf /etc/rancher /var/lib/rancher /var/lib/kubelet /etc/kubernetes /var/lib/etcd /etc/cni/net.d $HOME/.kube
        ip link delete cni0 || true
        ip link delete flannel.1 || true
        iptables -F && iptables -t nat -F && iptables -X
      ignore_errors: true
      when: nuclear_wipe | bool

    - name: Disable swap
      ansible.builtin.shell: |
        swapoff -a
        sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab

    - name: Load kernel modules
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Configure sysctl for Kubernetes networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
        mode: "0644"

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true

    - name: Configure containerd with SystemdCgroup
      ansible.builtin.shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
        systemctl restart containerd
      changed_when: true

    - name: Install apt dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
          - conntrack
          - ethtool
          - socat
          - ipset
        state: present

    - name: Add Kubernetes apt repository
      ansible.builtin.shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg --yes
        echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
      args:
        creates: /etc/apt/sources.list.d/kubernetes.list

    - name: Refresh apt cache after adding Kubernetes repository
      ansible.builtin.apt:
        update_cache: true

    - name: Unhold Kubernetes packages if previously held
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubelet
        - kubeadm
        - kubectl
      failed_when: false
      changed_when: false

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: latest
        update_cache: true

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

- name: Initialize control plane
  hosts: master
  become: true
  tasks:
    - name: Initialize cluster with kubeadm
      ansible.builtin.command: >-
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ apiserver_advertise_address }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Wait for API server
      ansible.builtin.wait_for:
        host: "{{ apiserver_advertise_address }}"
        port: 6443
        delay: 10
        timeout: 180

    - name: Configure kubeconfig for admin user on master
      ansible.builtin.shell: |
        mkdir -p $HOME/.kube
        cp -f /etc/kubernetes/admin.conf $HOME/.kube/config
        chown $(id -u):$(id -g) $HOME/.kube/config

    - name: Fetch kubeconfig to operator machine
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kubeconfig_dest }}"
        flat: true

    - name: Generate worker join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      until: join_cmd is not failed
      retries: 6
      delay: 15
      changed_when: false

    - name: Store join command for workers
      ansible.builtin.add_host:
        name: KUBE_JOIN_HOLDER
        command: "{{ join_cmd.stdout }}"

    - name: Allow scheduling on control-plane for single-node clusters
      ansible.builtin.command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when:
        - allow_control_plane_scheduling | bool
        - groups['workers'] | length == 0
      failed_when: false
      changed_when: false

- name: Join worker nodes
  hosts: workers
  become: true
  serial: 1
  tasks:
    - name: Join cluster
      ansible.builtin.command: "{{ hostvars['KUBE_JOIN_HOLDER']['command'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Configure operator workstation kubeconfig
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"
      when: configure_localhost | bool

    - name: Patch API server address in fetched kubeconfig
      ansible.builtin.replace:
        path: "{{ kubeconfig_dest }}"
        regexp: '127\.0\.0\.1:6443'
        replace: "{{ apiserver_advertise_address }}:6443"
      when: configure_localhost | bool

    - name: Write cluster env file for shells and setup.sh
      ansible.builtin.copy:
        dest: "{{ kubeconfig_env_file }}"
        mode: "0600"
        content: |
          export KUBECONFIG={{ kubeconfig_dest }}
          {% if enable_soar | bool %}
          export K8S_SOAR_ENABLE_SOAR=1
          {% endif %}
          {% if enable_observability | default(true) | bool %}
          export K8S_SOAR_ENABLE_OBSERVABILITY=1
          {% endif %}
      when: configure_localhost | bool

    - name: Source cluster env file from .bashrc
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.bashrc"
        line: '[ -f "{{ kubeconfig_env_file }}" ] && . "{{ kubeconfig_env_file }}"'
        create: true
        mode: "0644"
      when: configure_localhost | bool

    - name: Check if .zshrc exists
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.zshrc"
      register: zshrc_stat
      when: configure_localhost | bool

    - name: Source cluster env file from .zshrc
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.zshrc"
        line: '[ -f "{{ kubeconfig_env_file }}" ] && . "{{ kubeconfig_env_file }}"'
        mode: "0644"
      when:
        - configure_localhost | bool
        - zshrc_stat.stat.exists | default(false)

    - name: Print shell configuration hint
      ansible.builtin.debug:
        msg: >-
          Cluster env written to {{ kubeconfig_env_file }}.
          ~/.bashrc sources it automatically in new terminals.
          In the terminal where you ran setup, run once: source ~/.bashrc
      when: configure_localhost | bool

- name: Install k8s-soar Helm stack
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Skip Helm install when disabled
      ansible.builtin.meta: end_play
      when: not (install_k8s_soar | bool)

    - name: Ensure kubeconfig exists
      ansible.builtin.stat:
        path: "{{ kubeconfig_dest }}"
      register: kubeconfig_stat
      failed_when: not kubeconfig_stat.stat.exists

    - name: Wait for nodes to register (may be NotReady until CNI installs)
      ansible.builtin.shell: kubectl --kubeconfig="{{ kubeconfig_dest }}" get nodes -o name
      register: node_list
      until: node_list.stdout_lines | length > 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Label worker nodes
      ansible.builtin.command: >-
        kubectl --kubeconfig={{ kubeconfig_dest }}
        label node {{ item }}
        node-role.kubernetes.io/worker=worker
        --overwrite
      loop: "{{ groups['workers'] | default([]) }}"
      when: groups['workers'] | length > 0
      changed_when: false

    - name: Check if Helm is installed
      ansible.builtin.command: helm version --short
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Install Helm
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      when: helm_check.rc != 0

    - name: Add Helm chart repositories
      ansible.builtin.shell: |
        helm repo add falcosecurity https://falcosecurity.github.io/charts 2>/dev/null || true
        helm repo add cilium https://helm.cilium.io/ 2>/dev/null || true
        helm repo add kyverno https://kyverno.github.io/kyverno/ 2>/dev/null || true
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts 2>/dev/null || true
        helm repo add grafana https://grafana.github.io/helm-charts 2>/dev/null || true
      changed_when: false

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update

    - name: Build chart dependencies
      ansible.builtin.command: helm dependency build .
      args:
        chdir: "{{ k8s_soar_chart_path }}"

    - name: Install python3-yaml for rendering
      ansible.builtin.apt:
        name: python3-yaml
        state: present
      become: true
      delegate_to: localhost
      
    - name: Render Helm values
      ansible.builtin.command: ./scripts/render-helm-values.sh
      environment:
        K8S_SOAR_ENABLE_SOAR: "{{ enable_soar | bool | ternary('1', '0') }}"
        K8S_SOAR_ENABLE_OBSERVABILITY: "{{ enable_observability | default(true) | bool | ternary('1', '0') }}"
      args:
        chdir: "{{ k8s_soar_chart_path }}"

    - name: Load rendered Helm values
      ansible.builtin.slurp:
        src: "{{ k8s_soar_chart_path }}/values.yaml"
      register: slurp_helm_values

    - name: Parse rendered values
      ansible.builtin.set_fact:
        helm_values: "{{ slurp_helm_values.content | b64decode | from_yaml }}"

    - name: Read chart versions from Chart.lock
      ansible.builtin.slurp:
        src: "{{ k8s_soar_chart_path }}/Chart.lock"
      register: slurp_chart_lock

    - name: Parse Chart.lock
      ansible.builtin.set_fact:
        chart_lock: "{{ slurp_chart_lock.content | b64decode | from_yaml }}"

    - name: Map chart versions
      ansible.builtin.set_fact:
        versions: >-
          {{
            chart_lock.dependencies | items2dict(key_name='name', value_name='version')
          }}

    - name: Install Cilium
      ansible.builtin.command: >
        helm upgrade --install cilium charts/cilium-{{ versions['cilium'] }}.tgz
        --namespace kube-system --create-namespace
        -f .generated/cilium-values.yaml
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.cilium.enabled | default(false) | bool

    - name: Install local-path-provisioner (Bare-Metal StorageClass)
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"

    - name: Set local-path as default StorageClass
      ansible.builtin.command: >
        kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
    - name: Wait for nodes after Cilium
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=600s
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.cilium.enabled | default(false) | bool

    - name: Wait for Cilium to be ready
      ansible.builtin.command: kubectl rollout status ds/cilium -n kube-system --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.cilium.enabled | default(false) | bool

    - name: Wait for CoreDNS to be ready
      ansible.builtin.command: kubectl rollout status deployment/coredns -n kube-system --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.cilium.enabled | default(false) | bool

    - name: Install Kyverno
      ansible.builtin.command: >
        helm upgrade --install kyverno charts/kyverno-{{ versions['kyverno'] }}.tgz
        --namespace kyverno --create-namespace
        -f .generated/kyverno-values.yaml
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.kyverno.enabled | default(false) | bool

    - name: Install Loki
      ansible.builtin.command: >
        helm upgrade --install loki charts/loki-{{ versions['loki'] }}.tgz
        --namespace monitoring --create-namespace
        -f .generated/loki-values.yaml
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.observability.enabled | default(false) | bool

    - name: Install Promtail
      ansible.builtin.command: >
        helm upgrade --install promtail charts/promtail-{{ versions['promtail'] }}.tgz
        --namespace monitoring
        -f .generated/promtail-values.yaml
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.observability.enabled | default(false) | bool

    - name: Install kube-prometheus-stack
      ansible.builtin.command: >
        helm upgrade --install kube-prometheus-stack charts/kube-prometheus-stack-{{ versions['kube-prometheus-stack'] }}.tgz
        --namespace monitoring
        -f .generated/kube-prometheus-stack-values.yaml
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.observability.enabled | default(false) | bool

    - name: Install Falco
      ansible.builtin.command: >
        helm upgrade --install falco charts/falco-{{ versions['falco'] }}.tgz
        --namespace falco --create-namespace
        -f .generated/falco-values.yaml
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.falco.enabled | default(false) | bool

    - name: Install Tetragon
      ansible.builtin.command: >
        helm upgrade --install tetragon charts/tetragon-{{ versions['tetragon'] }}.tgz
        --namespace kube-system
        -f .generated/tetragon-values.yaml
        --set crds.installMethod=operator
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.tetragon.enabled | default(false) | bool

    - name: Install k8s-soar parent
      ansible.builtin.command: >
        helm upgrade --install k8s-soar .
        --namespace k8s-soar --create-namespace
        -f .generated/k8s-soar-values.yaml
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"

    - name: Apply policies
      ansible.builtin.shell: |
        ./scripts/wait-for-policy-crds.sh
        ./scripts/apply-policies.sh
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"

    - name: Install Shuffle
      ansible.builtin.command: >
        helm upgrade --install shuffle oci://ghcr.io/shuffle/charts/shuffle
        --namespace shuffle --create-namespace
        --set opensearch.enabled=true
        --set worker.replicas=1
        --set apps.enabled=true
        --set worker.manageAppDeployments=false
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"

    - name: Wait for all pods to be Ready (this may take minutes)
      ansible.builtin.shell: |
        kubectl get pods -A --no-headers | awk '{if ($4 != "Running" && $4 != "Completed") print $1"/"$2" ("$4")"}' | grep -v "^$" || true
      register: not_ready
      until: not_ready.stdout == ""
      retries: 90
      delay: 10
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"

    - name: Reconcile Falco metrics wiring
      ansible.builtin.command: >
        helm upgrade falco charts/falco-{{ versions['falco'] }}.tgz
        --namespace falco
        -f .generated/falco-values.yaml
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
      when: helm_values.observability.enabled | default(false) | bool

    - name: Generate a strong random password for Shuffle admin
      ansible.builtin.set_fact:
        shuffle_admin_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"

    - name: Auto-setup Shuffle Playbooks (Background port-forward)
      ansible.builtin.shell: |
        kubectl port-forward svc/shuffle-frontend -n shuffle 3001:3000 > /dev/null 2>&1 &
        PF_PID=$!
        sleep 3
        python3 ./scripts/auto-setup-shuffle.py "{{ shuffle_admin_password }}" || true
        kill $PF_PID > /dev/null 2>&1 || true
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"

    - name: Run verify-stack script
      ansible.builtin.command: ./scripts/verify-stack.sh
      args:
        chdir: "{{ k8s_soar_chart_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_dest }}"
