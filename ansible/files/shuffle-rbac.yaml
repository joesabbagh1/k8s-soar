apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuffle-soar-responder
  namespace: shuffle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shuffle-pod-patcher
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shuffle-soar-responder-binding
subjects:
  - kind: ServiceAccount
    name: shuffle-soar-responder
    namespace: shuffle
roleRef:
  kind: ClusterRole
  name: shuffle-pod-patcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: shuffle-soar-responder-token
  namespace: shuffle
  annotations:
    kubernetes.io/service-account.name: shuffle-soar-responder
type: kubernetes.io/service-account-token
