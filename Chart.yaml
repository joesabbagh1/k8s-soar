apiVersion: v2
name: k8s-soar
description: >
  Kubernetes Security Orchestration, Automation & Response (SOAR) stack.
  Deploys Cilium (eBPF CNI and network security), Falco (syscall threat detection),
  Tetragon (eBPF kernel enforcement), Kyverno (admission policy engine), and
  Grafana/Prometheus/Loki observability to bootstrap a real-time threat detection,
  response, and visualization environment.
type: application
version: 0.1.0
appVersion: "0.1.0"

keywords:
  - security
  - cilium
  - falco
  - tetragon
  - kyverno
  - soar
  - grafana
  - prometheus
  - loki
  - ebpf
  - threat-detection

maintainers:
  - name: joesabbagh1
    url: https://github.com/joesabbagh1

dependencies:
  - name: cilium
    version: "1.x.x"
    repository: "https://helm.cilium.io/"
    condition: cilium.enabled

  - name: falco
    version: "4.x.x"
    repository: "https://falcosecurity.github.io/charts"
    condition: falco.enabled

  - name: tetragon
    version: "1.x.x"
    repository: "https://helm.cilium.io/"
    condition: tetragon.enabled

  - name: kyverno
    version: "3.x.x"
    repository: "https://kyverno.github.io/kyverno/"
    condition: kyverno.enabled

  - name: kube-prometheus-stack
    version: "86.x.x"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: observability.enabled

  - name: loki
    version: "6.x.x"
    repository: "https://grafana.github.io/helm-charts"
    condition: observability.enabled

  - name: promtail
    version: "6.x.x"
    repository: "https://grafana.github.io/helm-charts"
    condition: observability.enabled
