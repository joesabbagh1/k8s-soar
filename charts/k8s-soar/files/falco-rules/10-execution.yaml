# k8s-soar — Execution (TA0002) and Command & Control (TA0011)

- rule: K8sSoar Reverse Shell
  desc: >
    A process in a workload container duplicated stdin/stdout/stderr onto a
    network socket. This is how reverse shells hand an attacker an interactive
    session (bash /dev/tcp, nc -e, python/perl one-liners).
  condition: k8s_soar_dup_stdio_to_socket and k8s_soar_workload
  output: >
    Reverse shell: stdio redirected to network socket
    (proc=%proc.name cmdline=%proc.cmdline connection=%fd.name parent=%proc.pname
    user=%user.name ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: CRITICAL
  tags: [k8s-soar, soar_contain, mitre_execution, mitre_command_and_control, T1059.004]

- rule: K8sSoar Shell Outbound Connection
  desc: >
    A shell binary opened an outbound network connection. Shells do not make
    network connections on their own; this is /dev/tcp-style C2 or staging.
  condition: outbound and k8s_soar_workload and proc.name in (k8s_soar_shell_binaries)
  output: >
    Shell opened outbound connection
    (proc=%proc.name cmdline=%proc.cmdline connection=%fd.name parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: CRITICAL
  tags: [k8s-soar, soar_contain, mitre_command_and_control, T1071]

- rule: K8sSoar Terminal Shell In Container
  desc: >
    An interactive (TTY-attached) shell was started in a workload container,
    typically via `kubectl exec -it`. Expected during debugging, suspicious
    otherwise; notify only.
  condition: k8s_soar_spawned_shell and k8s_soar_workload and proc.tty != 0
  output: >
    Interactive shell in container
    (shell=%proc.name parent=%proc.pname cmdline=%proc.cmdline user=%user.name
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_notify, mitre_execution, T1059]

- rule: K8sSoar Drifted Binary Executed
  desc: >
    A binary that is not part of the container image (written to the
    container's writable layer after start) was executed. Strong signal of a
    dropped payload: downloaded tools, miners, implants.
  condition: spawned_process and k8s_soar_workload and proc.is_exe_upper_layer = true
  output: >
    Executable not in image was run (drift)
    (proc=%proc.name exe=%proc.exepath cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: CRITICAL
  tags: [k8s-soar, soar_contain, mitre_execution, mitre_persistence, T1105]

- rule: K8sSoar Package Manager In Running Container
  desc: >
    A package manager installed or upgraded software inside a running
    container. Images should be immutable; installing packages at runtime is
    typical of attacker tooling. Read-only queries are ignored (nginx:alpine's
    entrypoint runs `apk manifest nginx` on every start).
  condition: >
    spawned_process and k8s_soar_workload and proc.name in (k8s_soar_package_managers)
    and k8s_soar_package_install
  output: >
    Package manager executed in running container
    (proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_notify, mitre_execution, mitre_persistence, T1072]
