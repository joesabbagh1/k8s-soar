# k8s-soar — Discovery (TA0007) and Lateral Movement (TA0008)

- rule: K8sSoar Network Recon Tool
  desc: Network scanning / raw-socket tooling run inside a workload container.
  condition: spawned_process and k8s_soar_workload and proc.name in (k8s_soar_network_tools)
  output: >
    Network tool executed in container
    (proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_notify, mitre_discovery, T1046]

- rule: K8sSoar Kubernetes Client In Container
  desc: >
    kubectl or another Kubernetes/runtime client ran inside a workload
    container. Common first step after token theft to enumerate the cluster.
  condition: spawned_process and k8s_soar_workload and proc.name in (k8s_soar_k8s_clients)
  output: >
    Kubernetes client executed in container
    (proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_notify, mitre_discovery, T1613]

- rule: K8sSoar Lateral Movement To Pod
  desc: >
    A shell launched wget or curl and it connected to a private address
    (another pod or a ClusterIP). The application itself was not the client;
    a shell tool opening an east-west connection is a pivot from a
    compromised pod. DNS (port 53) is ignored.
  condition: >
    evt.type = connect and evt.dir = < and k8s_soar_workload
    and (fd.typechar = 4 or fd.typechar = 6 or fd.type in (ipv4, ipv6))
    and (not fd.sport exists or fd.sport != 53)
    and (fd.sip in (k8s_soar_private_nets) or fd.snet in (k8s_soar_private_nets))
    and (evt.rawres >= 0 or evt.res = EINPROGRESS)
    and (proc.name in (wget, curl) or proc.cmdline contains "wget" or proc.cmdline contains "curl")
  output: >
    Shell tool connected to a private address (lateral movement)
    (proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname connection=%fd.name
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: CRITICAL
  tags: [k8s-soar, soar_contain, mitre_lateral_movement, T1021]

- rule: K8sSoar File and Directory Discovery
  desc: >
    A shell ran ls or find inside a workload container. Common during image
    startup, so notify only.
  condition: >
    spawned_process and k8s_soar_workload
    and proc.pname in (k8s_soar_shell_binaries)
    and proc.name in (ls, find)
  output: >
    Directory listing from a shell
    (proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_notify, mitre_discovery, T1083]

- rule: K8sSoar Process Discovery
  desc: A shell inspected the process table (ps, top, pgrep) inside a workload container.
  condition: >
    spawned_process and k8s_soar_workload
    and proc.pname in (k8s_soar_shell_binaries)
    and proc.name in (ps, top, pstree, pgrep)
  output: >
    Process listing from a shell
    (proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_notify, mitre_discovery, T1057]

- rule: K8sSoar Account Discovery
  desc: >
    A shell enumerated users: id/whoami, or a read of /etc/passwd or
    /etc/group. Notify only; some images read passwd at start.
  condition: >
    k8s_soar_workload and (
      (spawned_process and proc.pname in (k8s_soar_shell_binaries) and proc.name in (id, whoami, groups))
      or (open_read and fd.name in ("/etc/passwd", "/etc/group") and proc.name in (k8s_soar_file_readers))
    )
  output: >
    Account discovery in container
    (proc=%proc.name cmdline=%proc.cmdline file=%fd.name parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_notify, mitre_discovery, T1087]

- rule: K8sSoar System Information Discovery
  desc: A shell ran uname or hostname inside a workload container.
  condition: >
    spawned_process and k8s_soar_workload
    and proc.pname in (k8s_soar_shell_binaries)
    and proc.name in (uname, hostname)
  output: >
    System information discovery
    (proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_notify, mitre_discovery, T1082]

- rule: K8sSoar Container Discovery
  desc: >
    A process read its own cgroup or mount table. Used to learn the
    container runtime and what is mounted in.
  condition: >
    open_read and k8s_soar_workload
    and (fd.name = /proc/1/cgroup or fd.name = /proc/self/mountinfo)
  output: >
    Container identity files read
    (file=%fd.name proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_notify, mitre_discovery, T1613]

- rule: K8sSoar Kubelet Probe
  desc: >
    A workload container connected, or attempted to connect, to the kubelet
    port (10250). A refused connect still counts.
  condition: >
    evt.type = connect and evt.dir = < and k8s_soar_workload and fd.sport = 10250
  output: >
    Kubelet port probed
    (proc=%proc.name cmdline=%proc.cmdline connection=%fd.name parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: ERROR
  tags: [k8s-soar, soar_notify, mitre_discovery, T1613]

- rule: K8sSoar Latest Tag Image Started
  desc: >
    A process started from an image tagged latest. The tag is mutable, so
    the running bits are not pinned. Notify only.
  condition: spawned_process and k8s_soar_workload and container.image.tag = "latest"
  output: >
    Process started from a :latest image
    (proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_notify, mitre_defense_evasion, T1525]

- rule: K8sSoar API Server Access From Shell Tool
  desc: curl/wget pointed at the Kubernetes API from a workload container.
  condition: >
    spawned_process and k8s_soar_workload and proc.name in (curl, wget)
    and (proc.cmdline contains "kubernetes.default"
         or proc.cmdline contains "/api/v1/"
         or proc.cmdline contains "/apis/")
  output: >
    API server queried with shell tool
    (proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: ERROR
  tags: [k8s-soar, soar_notify, mitre_discovery, T1613]
