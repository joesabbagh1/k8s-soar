# k8s-soar — Credential Access (TA0006)

- rule: K8sSoar Service Account Token Read By Shell Tool
  desc: >
    The mounted Kubernetes service-account token was read by a shell or a
    file/transfer utility (cat, base64, curl...). Applications using client
    libraries also read the token, but never through these tools; this is
    token theft for API access or lateral movement.
  condition: >
    open_read and k8s_soar_sa_token_path and k8s_soar_workload
    and (proc.name in (k8s_soar_file_readers)
         or proc.name in (k8s_soar_shell_binaries)
         or proc.pname in (k8s_soar_shell_binaries))
  output: >
    Service account token read by interactive tool
    (file=%fd.name proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name container_id=%container.id
    image=%container.image.repository:%container.image.tag)
  priority: CRITICAL
  tags: [k8s-soar, soar_specific, soar_contain, mitre_credential_access, T1552.007]

- rule: K8sSoar Sensitive File Read
  desc: Read of password/sudo configuration or root SSH material inside a workload container.
  condition: >
    open_read and k8s_soar_workload
    and (fd.name in (k8s_soar_sensitive_files) or fd.name startswith /root/.ssh/)
  output: >
    Sensitive file read in container
    (file=%fd.name proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name container_id=%container.id
    image=%container.image.repository:%container.image.tag)
  priority: CRITICAL
  tags: [k8s-soar, soar_specific, soar_contain, mitre_credential_access, T1003.008]

- rule: K8sSoar Sensitive File Write
  desc: >
    A write to password, sudo, or root SSH material inside a workload
    container. Distinct from the read rule: appending to /etc/shadow is the
    usual attempt to plant a credential.
  condition: >
    open_write and k8s_soar_workload
    and (fd.name in (k8s_soar_sensitive_files) or fd.name startswith /root/.ssh/)
  output: >
    Sensitive file written in container
    (file=%fd.name proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name container_id=%container.id
    image=%container.image.repository:%container.image.tag)
  priority: CRITICAL
  tags: [k8s-soar, soar_specific, soar_contain, mitre_credential_access, mitre_impact, T1003.008]

- rule: K8sSoar Cloud Metadata Access
  desc: >
    Connection attempt to the cloud instance-metadata endpoint. A refused
    connect still counts, so a bare-metal lab raises the case. Cloud SDKs do
    this legitimately, so notify only.
  condition: >
    evt.type = connect and evt.dir = < and k8s_soar_workload
    and fd.sip = "169.254.169.254"
  output: >
    Instance metadata endpoint contacted
    (proc=%proc.name cmdline=%proc.cmdline connection=%fd.name
    ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name container_id=%container.id
    image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [k8s-soar, soar_specific, soar_notify, mitre_credential_access, T1552.005]
