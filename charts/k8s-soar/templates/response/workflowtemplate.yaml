{{- if .Values.response.enabled }}
# One Workflow per case. Open the Argo UI (make argo-ui) to watch each step,
# read its logs and outputs, and approve follow-up actions.
#
#   respond[ route + quarantine ] -> case[ enrich -> triage -> decide -> notify -> auto-act | review[ approve -> act ] ]
#
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: falco-response
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
  annotations:
    workflows.argoproj.io/description: >-
      k8s-soar case: decide, quarantine, collect evidence, AI triage, notify,
      then wait for an analyst to approve any destructive follow-up.
spec:
  entrypoint: run
  serviceAccountName: {{ include "k8s-soar.responderSA" . }}
  activeDeadlineSeconds: {{ .Values.response.activeDeadlineSeconds }}
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.response.workflowTTLSeconds }}
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 24h
  podMetadata:
    labels:
      app.kubernetes.io/part-of: k8s-soar
      app.kubernetes.io/component: responder
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: outputs
      emptyDir: {}
    {{- include "k8s-soar.devVolume" . | nindent 4 }}
  {{- include "k8s-soar.devNode" . | nindent 2 }}
  arguments:
    parameters:
      - name: alert
        description: Raw Falco (or Alertmanager) event JSON
  metrics:
    prometheus:
      - name: k8s_soar_cases_total
        help: Response workflows by final status
        labels:
          - key: status
            value: "{{`{{workflow.status}}`}}"
        counter:
          value: "1"
  templates:
    # Steps whose outputs are used later always run (and no-op when not
    # needed), so no step ever references outputs of a skipped step.
    - name: run
      steps:
        # One pod routes the alert AND quarantines the pod: every extra step is another pod
        # start (several seconds each) in the time between detection and containment.
        - - name: respond
            template: respond
        - - name: case
            template: case
            when: "'{{`{{steps.respond.outputs.parameters.action}}`}}' != 'skip'"
            arguments:
              parameters:
                - name: decision
                  value: "{{`{{steps.respond.outputs.parameters.decision}}`}}"
                - name: contained
                  value: "{{`{{steps.respond.outputs.parameters.contained}}`}}"
                - name: namespace
                  value: "{{`{{steps.respond.outputs.parameters.namespace}}`}}"
                - name: pod
                  value: "{{`{{steps.respond.outputs.parameters.pod}}`}}"

    - name: case
      inputs:
        parameters:
          - name: decision
          - name: contained
          - name: namespace
          - name: pod
      steps:
        - - name: enrich
            template: enrich
        - - name: triage
            template: triage
            arguments:
              parameters:
                - name: context
                  value: "{{`{{steps.enrich.outputs.parameters.context}}`}}"
                - name: decision
                  value: "{{`{{inputs.parameters.decision}}`}}"
        - - name: decide
            template: decide
            arguments:
              parameters:
                - name: verdict
                  value: "{{`{{steps.triage.outputs.parameters.verdict}}`}}"
        - - name: notify
            template: notify
            continueOn:
              failed: true
            arguments:
              parameters:
                - name: decision
                  value: "{{`{{inputs.parameters.decision}}`}}"
                - name: contained
                  value: "{{`{{inputs.parameters.contained}}`}}"
                - name: verdict
                  value: "{{`{{steps.triage.outputs.parameters.verdict}}`}}"
                - name: route
                  value: "{{`{{steps.decide.outputs.parameters.result}}`}}"
        # Exactly one of these runs (or neither when the route is none).
        - - name: auto-act
            template: act
            when: "'{{`{{steps.decide.outputs.parameters.route}}`}}' == 'auto' && '{{`{{steps.decide.outputs.parameters.action}}`}}' != 'none'"
            arguments:
              parameters:
                - name: action
                  value: "{{`{{steps.decide.outputs.parameters.action}}`}}"
                - name: namespace
                  value: "{{`{{inputs.parameters.namespace}}`}}"
                - name: pod
                  value: "{{`{{inputs.parameters.pod}}`}}"
          - name: review
            template: review
            when: "'{{`{{steps.decide.outputs.parameters.route}}`}}' == 'human'"
            arguments:
              parameters:
                - name: namespace
                  value: "{{`{{inputs.parameters.namespace}}`}}"
                - name: pod
                  value: "{{`{{inputs.parameters.pod}}`}}"

    - name: review
      inputs:
        parameters:
          - name: namespace
          - name: pod
      steps:
        - - name: approve
            template: approve
        - - name: act
            template: act
            when: "'{{`{{steps.approve.outputs.parameters.action}}`}}' != 'none'"
            arguments:
              parameters:
                - name: action
                  value: "{{`{{steps.approve.outputs.parameters.action}}`}}"
                - name: namespace
                  value: "{{`{{inputs.parameters.namespace}}`}}"
                - name: pod
                  value: "{{`{{inputs.parameters.pod}}`}}"

    # 1+2. Route the alert, claim the pod (dedup) and, when the rule says so, quarantine it
    #      (label + orphan from its controller) in the same pod. Outputs action=contain|notify|skip
    #      and `contained` (the quarantine result, or why nothing was done). A quarantine error is
    #      recorded in `contained` and does not stop the case.
    #      Logs time_to_contain_seconds=<n> (the Grafana "Response" dashboard reads it from Loki).
    - name: respond
      container:
        {{- include "k8s-soar.step" (dict "root" . "args" (list "respond" "--alert" "{{workflow.parameters.alert}}" "--case" "{{workflow.name}}")) | nindent 8 }}
      outputs:
        parameters:
          {{- include "k8s-soar.output" "decision" | nindent 10 }}
          - name: action
            valueFrom:
              path: /tmp/outputs/action
              default: skip
          - name: namespace
            valueFrom:
              path: /tmp/outputs/namespace
              default: ""
          - name: pod
            valueFrom:
              path: /tmp/outputs/pod
              default: ""
          - name: contained
            valueFrom:
              path: /tmp/outputs/contained
              default: "{}"

    # 3. Read-only evidence: pod spec, owners, events, logs, Falco + Tetragon history.
    - name: enrich
      container:
        {{- include "k8s-soar.step" (dict "root" . "args" (list "enrich" "--alert" "{{workflow.parameters.alert}}")) | nindent 8 }}
      outputs:
        parameters:
          {{- include "k8s-soar.output" "context" | nindent 10 }}

    # 4. AI verdict (returns 'unavailable' when ai.enabled=false or the provider fails).
    - name: triage
      inputs:
        parameters:
          - name: context
          - name: decision
      container:
        {{- include "k8s-soar.step" (dict "root" . "args" (list "triage" "--alert" "{{workflow.parameters.alert}}" "--context" "{{inputs.parameters.context}}" "--decision" "{{inputs.parameters.decision}}")) | nindent 8 }}
      outputs:
        parameters:
          {{- include "k8s-soar.output" "verdict" | nindent 10 }}
          - name: recommended
            valueFrom:
              path: /tmp/outputs/recommended
              default: none

    # 5. Automatic action or analyst approval, per severity (response.decisions).
    #    Outputs route=auto|human|none, action, and result (JSON with the reason).
    - name: decide
      inputs:
        parameters:
          - name: verdict
      container:
        {{- include "k8s-soar.step" (dict "root" . "args" (list "decide" "--alert" "{{workflow.parameters.alert}}" "--verdict" "{{inputs.parameters.verdict}}")) | nindent 8 }}
      outputs:
        parameters:
          {{- include "k8s-soar.output" "result" | nindent 10 }}
          - name: route
            valueFrom:
              path: /tmp/outputs/route
              default: human
          - name: action
            valueFrom:
              path: /tmp/outputs/action
              default: none

    # 6. Slack, Teams, Google Chat, webhook, email, PagerDuty, Jira, Grafana (each only if configured).
    - name: notify
      inputs:
        parameters:
          - name: decision
          - name: contained
          - name: verdict
          - name: route
      container:
        {{- include "k8s-soar.step" (dict "root" . "args" (list "notify" "--alert" "{{workflow.parameters.alert}}" "--decision" "{{inputs.parameters.decision}}" "--contained" "{{inputs.parameters.contained}}" "--verdict" "{{inputs.parameters.verdict}}" "--route" "{{inputs.parameters.route}}" "--workflow" "{{workflow.name}}")) | nindent 8 }}
      outputs:
        parameters:
          {{- include "k8s-soar.output" "result" | nindent 10 }}

    # 7. Human approval. In the Argo UI: open the case -> "approve" node -> RESUME,
    #    pick an action (default 'none'). CLI: argo resume <case> -n {{ .Release.Namespace }}
    # The Argo UI's RESUME dialog sends back every input of this node as an
    # output parameter, so it must have exactly the inputs it outputs.
    - name: approve
      inputs:
        parameters:
          - name: action
            default: none
            enum: [none, delete-pod, scale-to-zero, release-quarantine]
            description: >-
              Action to run on the pod, or 'none' to close the case. The AI
              recommendation is on the triage step (INPUTS/OUTPUTS) and in the
              Slack/Jira notification.
      suspend: {}
      outputs:
        parameters:
          - name: action
            valueFrom:
              supplied: {}

    # 8. Run the action (approved by an analyst, or automatic).
    - name: act
      inputs:
        parameters:
          - name: action
          - name: namespace
          - name: pod
      container:
        {{- include "k8s-soar.step" (dict "root" . "args" (list "act" "--action" "{{inputs.parameters.action}}" "--namespace" "{{inputs.parameters.namespace}}" "--pod" "{{inputs.parameters.pod}}")) | nindent 8 }}
      outputs:
        parameters:
          {{- include "k8s-soar.output" "result" | nindent 10 }}
{{- end }}
