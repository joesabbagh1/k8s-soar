{{- if and .Values.console.enabled .Values.response.enabled }}
# Analyst console: case list, case page and decision buttons. It reads case
# Workflows and resumes their approval gate through the Argo Server API; it
# never touches workloads itself (the case's `act` step does, as soar-responder).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: soar-console
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
---
# Used when Argo Server runs with authMode "client" (the console forwards its
# token); ignored in "server" mode.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: soar-console
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: soar-console
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: soar-console
subjects:
  - kind: ServiceAccount
    name: soar-console
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soar-console
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
    app.kubernetes.io/name: soar-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soar-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soar-console
        app.kubernetes.io/part-of: k8s-soar
    spec:
      serviceAccountName: soar-console
      {{- include "k8s-soar.devNode" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: {{ include "k8s-soar.image" (dict "root" . "name" .Values.console.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: soar-config
          env:
            {{- include "k8s-soar.devEnv" . | nindent 12 }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONSOLE_ARGO_SERVER_URL
              value: {{ .Values.console.argoServerUrl | quote }}
            - name: CONSOLE_ARGO_VERIFY_TLS
              value: {{ .Values.console.argoVerifyTls | quote }}
            - name: CONSOLE_USER_HEADER
              value: {{ .Values.console.userHeader | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "k8s-soar.devMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "k8s-soar.devVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: soar-console
  labels:
    {{- include "k8s-soar.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: soar-console
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
