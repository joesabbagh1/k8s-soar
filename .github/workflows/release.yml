name: Release

# Tag vX.Y.Z -> images ghcr.io/<owner>/k8s-soar-{actions,console,agent}:X.Y.Z and the
# chart oci://ghcr.io/<owner>/charts/k8s-soar:X.Y.Z (appVersion X.Y.Z, which is
# the image tag the chart uses by default).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    uses: ./.github/workflows/build-images.yml
    with:
      tags: ${{ needs.version.outputs.version }}
    secrets: inherit

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/k8s-soar --version "$version" --app-version "$version" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/k8s-soar-${version}.tgz" "oci://${{ env.REGISTRY }}/charts"
