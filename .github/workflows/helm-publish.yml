name: Publish Helm Chart to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'Chart.yaml'
      - 'Chart.lock'
      - 'values.yaml'
      - 'templates/**'
      - 'ansible/**'
      - 'scripts/**'
      - '.github/workflows/helm-publish.yml'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'templates/**'
      - 'scripts/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CHART_NAME: k8s-soar

jobs:
  lint-and-test:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Add chart repositories
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo add cilium         https://helm.cilium.io/
          helm repo add kyverno        https://kyverno.github.io/kyverno/
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build

      - name: Lint chart
        run: helm lint .

      - name: Template chart
        run: helm template k8s-soar . --debug > /dev/null

      - name: Validate policies kustomize
        run: kubectl kustomize policies/ > /dev/null

      - name: Validate lab kustomize
        run: kubectl kustomize lab/ > /dev/null

      - name: Shellcheck scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh ansible/setup.sh scenarios/run-all.sh scenarios/*/run.sh || true

  publish:
    name: Package & Push to GHCR
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Add chart repositories
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo add cilium         https://helm.cilium.io/
          helm repo add kyverno        https://kyverno.github.io/kyverno/
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build

      - name: Resolve chart version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            CHART_VER=$(grep '^version:' Chart.yaml | awk '{print $2}')
            SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
            VERSION="${CHART_VER}-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved chart version: ${VERSION}"

      - name: Package chart
        run: |
          helm package . \
            --version "${{ steps.version.outputs.version }}" \
            --destination ./dist

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push chart to GHCR
        run: |
          helm push ./dist/${{ env.CHART_NAME }}-${{ steps.version.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}

      - name: Print install command
        run: |
          echo "Chart published!"
          echo "  Use ./ansible/setup.sh for bare-metal bootstrap, or:"
          echo "  helm install k8s-soar oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHART_NAME }} \\"
          echo "    --version ${{ steps.version.outputs.version }} \\"
          echo "    --namespace k8s-soar --create-namespace --wait"
