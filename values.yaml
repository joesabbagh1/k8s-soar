# ==============================================================================
# k8s-soar — Values
# Cilium + Falco + Tetragon + Kyverno security stack
# ==============================================================================

# ------------------------------------------------------------------------------
# SOAR — Detect → Isolate response automation
# Enable SOAR Detect → Isolate by setting soar.responder.enabled=true and
# falco.falcosidekick.enabled=true (see README).
# ------------------------------------------------------------------------------
soar:
  responder:
    enabled: false
    image: python:3.12-alpine
    port: 8080
  quarantine:
    labelKey: security.quarantine
    labelValue: "true"

# ------------------------------------------------------------------------------
# Cilium — eBPF CNI, network policy, and observability (Hubble)
# Installed as the pod network after kubeadm init (bare-metal bootstrap).
# ------------------------------------------------------------------------------
cilium:
  enabled: true

  kubeProxyReplacement: true

  operator:
    replicas: 1

  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true

# ------------------------------------------------------------------------------
# Falco — Runtime threat detection (syscall-level via modern eBPF)
# ------------------------------------------------------------------------------
falco:
  enabled: true

  driver:
    kind: modern_ebpf

  jsonOutput: true
  jsonIncludeOutputProperty: true
  jsonIncludeTagsProperty: true
  logLevel: info

  falcosidekick:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ------------------------------------------------------------------------------
# Tetragon — Kernel-level eBPF enforcement (Cilium sub-project)
# ------------------------------------------------------------------------------
tetragon:
  enabled: true

  tetragon:
    grpc:
      address: "localhost:54321"
    prometheusPort: 2112
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  tetragonOperator:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# ------------------------------------------------------------------------------
# Kyverno — Kubernetes admission policies (policy-as-code)
# ------------------------------------------------------------------------------
kyverno:
  enabled: true

  admissionController:
    replicas: 1
  backgroundController:
    resources:
      limits:
        memory: 128Mi
  cleanupController:
    resources:
      limits:
        memory: 128Mi
  reportsController:
    resources:
      limits:
        memory: 128Mi
