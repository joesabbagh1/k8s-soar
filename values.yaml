# ==============================================================================
# k8s-soar — Values
# Cilium + Falco + Tetragon + Kyverno + Observability security stack
# ==============================================================================

# ------------------------------------------------------------------------------
# Policies — applied via scripts/apply-policies.sh after Helm install
# (not bundled in the chart; umbrella release Secret would exceed the 1MB limit)
# ------------------------------------------------------------------------------
policies:
  enabled: true

# ------------------------------------------------------------------------------
# SOAR — Detect → Isolate response automation
# ------------------------------------------------------------------------------
soar:
  quarantine:
    labelKey: security.quarantine
    labelValue: "true"

# ------------------------------------------------------------------------------
# Cilium — eBPF CNI, network policy, and observability (Hubble)
# Installed as the pod network after kubeadm init (bare-metal bootstrap).
# ------------------------------------------------------------------------------
cilium:
  enabled: true
  namespaceOverride: kube-system

  kubeProxyReplacement: true

  operator:
    replicas: 1

  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true

# ------------------------------------------------------------------------------
# Falco — Runtime threat detection (syscall-level via modern eBPF)
# ------------------------------------------------------------------------------
falco:
  enabled: true
  namespaceOverride: falco

  # Flush JSON alerts immediately (needed for kubectl logs evidence capture).
  tty: true

  collectors:
    docker:
      enabled: false
    containerd:
      enabled: false
    crio:
      enabled: false
    containerEngine:
      enabled: true
    kubernetes:
      enabled: true

  driver:
    kind: modern_ebpf

  jsonOutput: true
  jsonIncludeOutputProperty: true
  jsonIncludeTagsProperty: true
  logLevel: info

  # Explicit refs so falcoctl installs plugins required by collectors.*.enabled.
  # Without these, Falco warns and k8s-soar rules (container + k8s.ns.name) never match.
  falcoctl:
    artifact:
      install:
        enabled: true
      follow:
        enabled: true
    config:
      artifact:
        install:
          resolveDeps: true
          refs:
            - falco-rules:4
            - ghcr.io/falcosecurity/plugins/plugin/k8smeta:0.3.0
            - ghcr.io/falcosecurity/plugins/plugin/container:0.2.4
        follow:
          refs:
            - falco-rules:4

  falcosidekick:
    enabled: true
    config:
      webhook:
        # Update this address after configuring the Shuffle webhook
        address: "http://shuffle-backend.shuffle.svc.cluster.local:5001/api/v1/hooks/falco"
        minimumpriority: "warning"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ------------------------------------------------------------------------------
# Tetragon — Kernel-level eBPF enforcement (Cilium sub-project)
# ------------------------------------------------------------------------------
tetragon:
  enabled: true

  # CRDs are installed by the Tetragon operator (default). Do not use "helm" on
  # upgrades — operator-owned CRDs lack Helm labels and will block the release.

  tetragon:
    grpc:
      address: "localhost:54321"
    prometheusPort: 2112
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  tetragonOperator:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# ------------------------------------------------------------------------------
# Kyverno — Kubernetes admission policies (policy-as-code)
# ------------------------------------------------------------------------------
kyverno:
  enabled: true
  namespaceOverride: kyverno

  admissionController:
    replicas: 1
  backgroundController:
    resources:
      limits:
        memory: 128Mi
  cleanupController:
    resources:
      limits:
        memory: 128Mi
  reportsController:
    resources:
      limits:
        memory: 128Mi

# ------------------------------------------------------------------------------
# Observability — Grafana + Prometheus + Loki (enabled by default)
# Visualize Falco findings, stack metrics, and Grafana/Loki alerts.
# Disable with observability.enabled=false or K8S_SOAR_ENABLE_OBSERVABILITY=0
# ------------------------------------------------------------------------------
observability:
  enabled: true
  namespace: monitoring

  loki:
    deploymentMode: SingleBinary
    useTestSchema: true
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    singleBinary:
      replicas: 1
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

  promtail:
    enabled: true

  kubePrometheusStack:
    releaseName: kube-prometheus-stack
    grafana:
      adminPassword: k8s-soar
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          isDefault: false
          jsonData:
            maxLines: 1000
    prometheus:
      prometheusSpec:
        retention: 7d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: 'shuffle-webhook'
          routes:
          - receiver: 'shuffle-webhook'
            matchers:
              - severity="critical"
        receivers:
        - name: 'shuffle-webhook'
          webhook_configs:
          - url: 'http://shuffle-webhook.shuffle.svc.cluster.local:5001/api/v1/hooks/alertmanager-webhook-trigger'
            send_resolved: true
